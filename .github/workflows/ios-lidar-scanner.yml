name: "iOS LiDAR Scanner"
on:
  push:
    paths:
      - "ios/LidarScanner/**"
      - ".github/workflows/ios-lidar-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        working-directory: ios/LidarScanner
        run: |
          xcodebuild \
            -project LidarScanner.xcodeproj \
            -scheme LidarScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        working-directory: ios/LidarScanner
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LidarScanner.app Payload/
          zip -qry LidarScanner-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LidarScanner-unsigned-ipa
          path: ios/LidarScanner/LidarScanner-unsigned.ipa
